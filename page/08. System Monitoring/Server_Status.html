<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Status</title>
</head>

<body>
    <main class="Server_Status">
        <div class="main_content">

            <!-- 상태 알림 -->
            <div class="status_alarm normal">
                <div>
                    <span class="material-symbols-outlined">check_circle</span>
                    <p>There are no events currently occurring.</p>
                </div>
                <span class="material-symbols-outlined">close_small</span>
            </div>

            <div class="content">
                <div class="header_title">
                    <div>
                        <div class="title">
                            <div class="title_bar"></div>
                            <span class="title_text">Server Status</span>
                        </div>
                        <span>/ System Monitoring</span>
                    </div>
                </div>

                <div class="page Server_Status_content">
                    <div class="toggle_btn">
                            <button class="active">Single View</button>
                            <button>Comparison View</button>
                        </div>
                </div>
            </div>

            <footer>
                <p>ⓒ Aviation Weather Integrated Management Platform.v</p>
                <p>AWIMP v1.0.0</p>
            </footer>
        </div>
    </main>
</body>

</html>
